<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/timecut-pwa-logo.webp" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Two framings of one logo, because the phone draws it two ways. Measured
         from photographs of an installed app rather than assumed, since the
         assumption was wrong twice:

         The HOME SCREEN takes the "maskable" file and draws it as it is — no
         mask, no crop. So that one is the whole artwork, which carries its own
         rounded corners: icon-192/512. Anything padded sits smaller than the
         apps beside it, and anything full-bleed shows as a hard square.

         The LAUNCH SCREEN takes the "any" file and shows the middle ~72% of it
         (the artwork's T measured 91% of that screen against 66% of the file).
         So that one is padded to ~70%: icon-launch-*, whose crop is the whole
         logo, ending up the same size and shape as the page's own launch
         screen below.

         Both files are the same picture. Swapping them is what made the icon
         square, and what left the launch screen cropped. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090B" />
    <!-- The page is dark before any stylesheet has been parsed, so a launch
         never starts with a white frame. -->
    <meta name="color-scheme" content="dark" />
    <!-- Fetched with the HTML in the installed app, so the logo arrives in one
         piece. It used to be the 512px icon, a third of a megabyte, which drew
         itself down the screen in strips on a phone connection. -->
    <link rel="preload" as="image" href="/splash-logo.webp" media="(display-mode: standalone)" fetchpriority="high" />
    <style>
      /* Installed-app launch screen — see the markup at the end of the body.
         It shows itself in CSS, with no script of any kind: the page's
         Content-Security-Policy allows no inline script, and a file would
         still have to arrive before the first paint to be of any use.

         It comes down when the app says it has rendered (src/lib/launchScreen
         adds `app-loaded`), never merely after a set time — fading on a timer
         uncovered an empty page on a slow start, which read as a second flash
         before the app appeared. The failsafe animation below is what hides it
         when that signal never comes, so it can never strand anyone. */
      #app-splash { display: none; }
      @media all and (display-mode: standalone), all and (display-mode: fullscreen), all and (display-mode: minimal-ui) {
        @media screen { html, body { background: #000000; } }
        #app-splash {
          position: fixed;
          inset: 0;
          z-index: 2147483647;
          display: flex;
          align-items: center;
          justify-content: center;
          /* Matches the manifest's background_color and the black the logo sits
             on, so the handover from Android's own launch screen to this one is
             invisible and no square edge shows around the artwork. */
          background: #000000;
          animation: app-splash-failsafe 6s ease-in forwards;
        }
        html.app-loaded #app-splash { animation: app-splash-exit 320ms ease-in forwards; }
        /* The size Android's own launch screen draws the logo: 55% of the
           screen width in photographs of a 3x phone, which is 224px there. The
           logo therefore stays put when this screen takes over from the system
           one, instead of jumping to another size mid-launch. */
        #app-splash img { width: min(224px, 55vw); height: auto; }
      }
      /* Only for an app that never finished loading. */
      @keyframes app-splash-failsafe {
        0%, 94% { opacity: 1; visibility: visible; }
        100% { opacity: 0; visibility: hidden; }
      }
      @keyframes app-splash-exit {
        from { opacity: 1; visibility: visible; }
        to { opacity: 0; visibility: hidden; }
      }
    </style>
    <!-- Defaults for the first paint and for link-preview crawlers, which do not
         run JavaScript. RouteMeta replaces title/description per route and adds
         the canonical; no canonical here, or every URL would claim the homepage. -->
    <title>TimeCut: AI Risk Discovery for Contracts, Quotes &amp; CVs</title>
    <meta name="description" content="Upload contracts, supplier quotations, CVs and proposals. TimeCut's AI finds hidden risks, missing information and weak evidence before you decide." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TimeCut" />
    <meta property="og:title" content="TimeCut: AI Risk Discovery for Contracts, Quotes &amp; CVs" />
    <meta property="og:description" content="Upload contracts, supplier quotations, CVs and proposals. TimeCut's AI finds hidden risks, missing information and weak evidence before you decide." />
    <meta property="og:image" content="https://www.timecut.online/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.timecut.online/#organization",
            "name": "TimeCut",
            "url": "https://www.timecut.online/",
            "logo": "https://www.timecut.online/icon-512.png"
          },
          {
            "@type": "WebSite",
            "@id": "https://www.timecut.online/#website",
            "name": "TimeCut",
            "url": "https://www.timecut.online/",
            "publisher": { "@id": "https://www.timecut.online/#organization" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Installed-app launch screen ─────────────────────────────────────────
         Android shows its own splash only until the page paints, which for this
         app is fast enough that the logo flashed past before it could be read.
         This holds the same logo on the same background for about a second and
         a half, so opening the app looks deliberate rather than jumpy.

         It is only for the installed app: a visitor on the website gets the
         page immediately, with nothing standing in front of it. The markup and
         its styles sit in this file so the screen is there on the very first
         paint, before the bundle has loaded. -->
    <div id="app-splash" aria-hidden="true"><img src="/splash-logo.webp" alt="" width="224" height="224" /></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
